name: Build, test and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified upstream engine
        shell: pwsh
        run: ./fetch-engine.ps1
      - name: Test without starting real driver
        shell: pwsh
        run: ./test.ps1
      - name: Build portable application
        shell: pwsh
        run: ./package-friends.ps1
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: ByPass-win-x64
          path: |
            releases/ByPass-win-x64.zip*
            releases/Obhod-*-win-x64.zip*
            releases/update.json
      - name: Publish new version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ([version]([regex]::Match((Get-Content src/Version.cs -Raw), 'Value = "([0-9.]+)"').Groups[1].Value)).ToString(3)
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "Version $version already published; increase src/Version.cs for the next release."; exit 0 }
          gh release create $tag "releases/ByPass-win-x64.zip" "releases/ByPass-win-x64.zip.sha256.txt" "releases/Obhod-$version-win-x64.zip" "releases/Obhod-$version-win-x64.zip.sha256.txt" "releases/update.json" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "ByPass $version" --notes-file RELEASE-NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
