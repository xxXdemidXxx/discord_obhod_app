name: Build, test and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch verified upstream engine
        shell: pwsh
        run: ./fetch-engine.ps1
      - name: Test without starting real driver
        shell: pwsh
        run: ./test.ps1
      - name: Build portable application
        shell: pwsh
        run: ./package-friends.ps1
      - name: Scan release with Microsoft Defender
        shell: pwsh
        run: |
          Start-Service WinDefend
          Update-MpSignature
          ./tools/scan-release.ps1
      - name: Upload checked build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ByPass-win-x64
          path: |
            releases/ByPass-win-x64.zip*
            releases/Obhod-*-win-x64.zip*
            releases/update-unsigned.json
            releases/security-report.json
            releases/defender-scan.log
  draft:
    needs: windows
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ByPass-win-x64
          path: releases
      - name: Create draft for offline approval
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ([version]([regex]::Match((Get-Content src/Version.cs -Raw), 'Value = "([0-9.]+)"').Groups[1].Value)).ToString(3)
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host 'Release already exists; published assets are never overwritten.'; exit 0 }
          gh release create $tag "releases/ByPass-win-x64.zip" "releases/ByPass-win-x64.zip.sha256.txt" "releases/Obhod-$version-win-x64.zip" "releases/Obhod-$version-win-x64.zip.sha256.txt" "releases/update-unsigned.json" "releases/security-report.json" "releases/defender-scan.log" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "ByPass $version" --notes-file RELEASE-NOTES.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
